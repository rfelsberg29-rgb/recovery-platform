<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R3coveryIQ</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #141210; color: #f4efe6; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 28rem; padding: 2rem; }
    a { color: #e09a78; }
  </style>
</head>
<body>
  <main>
    <h1>R3coveryIQ</h1>
    <p id="status">Checking whether the site is up…</p>
    <p><a id="open" href="https://beef-nokia-jewel-laptop.trycloudflare.com">Open the site</a></p>
  </main>
  <script>
    const url = "https://beef-nokia-jewel-laptop.trycloudflare.com";
    const status = document.getElementById("status");
    fetch(url, { method: "GET", mode: "no-cors", cache: "no-store" })
      .then(() => { status.textContent = "Opening…"; location.replace(url); })
      .catch(() => { status.textContent = "The computer that runs this site is asleep or off. Wake that Mac, stay signed in, and reload this page."; });
  </script>
</body>
</html>
